name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: License allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check dependency licenses
        run: make check-licenses

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase predates this gate and still carries a
    # handful of strict-mode violations (long string literals). Flip to
    # blocking once `make lint` is green locally.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint (strict)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/realm/swiftlint:0.57.1 swiftlint --strict

  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run tests
        run: |
          xcodebuild test \
            -project Scribe.xcodeproj -scheme ScribeTests \
            -skipMacroValidation -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

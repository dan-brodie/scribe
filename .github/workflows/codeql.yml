name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC — catches advisories in code that hasn't changed.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-14
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: |
          xcodebuild \
            -project Scribe.xcodeproj -scheme Scribe -configuration Debug \
            -skipMacroValidation -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
